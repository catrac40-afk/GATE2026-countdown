<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GATE · 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    background: #000000;
    color: #ffffff;
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .container {
    text-align: center;
    padding: 4rem 2rem;
    max-width: 480px;
    width: 100%;
    opacity: 0;
    animation: slowBreathIn 4.2s ease-out forwards;
  }

  @keyframes slowBreathIn {
    0%   { opacity: 0; transform: translateY(80px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .title {
    font-family: 'Playfair Display', serif;
    font-size: 3.6rem;
    font-weight: 400;
    letter-spacing: -2px;
    margin-bottom: 0.4rem;
    opacity: 0.92;
  }

  .date {
    font-size: 1.1rem;
    font-weight: 300;
    letter-spacing: 3px;
    opacity: 0.45;
    margin-bottom: 5rem;
    text-transform: uppercase;
  }

  .countdown {
    display: flex;
    justify-content: center;
    gap: 60px;
    flex-wrap: wrap;
  }

  .unit {
    min-width: 100px;
  }

  .number {
    font-family: 'Inter', sans-serif;
    font-size: 4.8rem;
    font-weight: 300;
    letter-spacing: -6px;
    line-height: 1;
    color: #ffffff;
    opacity: 0;
    transform: translateY(30px);
    transition: all 3.8s cubic-bezier(0.23, 1, 0.32, 1);
  }

  .number.visible {
    opacity: 0.95;
    transform: translateY(0);
  }

  .flip {
    animation: breathFlip 5s cubic-bezier(0.23, 1, 0.32, 1);
  }

  @keyframes breathFlip {
    0%   { transform: translateY(0);   opacity: 0.4; }
    40%  { transform: translateY(-35px); opacity: 0.65; }
    70%  { transform: translateY(22px);  opacity: 0.9;  }
    100% { transform: translateY(0);   opacity: 0.95; }
  }

  .label {
    font-size: 0.78rem;
    font-weight: 300;
    letter-spacing: 4px;
    opacity: 0.35;
    margin-top: 1.2rem;
    text-transform: uppercase;
  }

  .breathe {
    position: absolute;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.9rem;
    font-weight: 300;
    opacity: 0.28;
    letter-spacing: 6px;
    white-space: nowrap;
  }

  @media (max-width: 480px) {
    .title   { font-size: 2.9rem; }
    .number  { font-size: 3.8rem; letter-spacing: -4px; }
    .countdown { gap: 40px; }
    .unit    { min-width: 80px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="title">GATE 2026</div>
  <div class="date">08 . 02 . 26</div>

  <div class="countdown" id="countdown">
    <div class="unit">
      <div class="number" id="days">00</div>
      <div class="label">days</div>
    </div>
    <div class="unit">
      <div class="number" id="hours">00</div>
      <div class="label">hours</div>
    </div>
    <div class="unit">
      <div class="number" id="minutes">00</div>
      <div class="label">minutes</div>
    </div>
    <div class="unit">
      <div class="number" id="seconds">00</div>
      <div class="label">seconds</div>
    </div>
  </div>
</div>

<div class="breathe">inhale · exhale</div>

<script>
const GATE_DATE = new Date("2026-02-08T00:00:00+05:30");

let lastValues = { days:-1, hours:-1, minutes:-1, seconds:-1 };

function update() {
  const diff = GATE_DATE - new Date();

  if (diff <= 0) {
    document.body.innerHTML = 
      '<div style="text-align:center; color:#fff; font-family:\'Playfair Display\',serif; font-size:3.2rem; font-weight:400; opacity:0.9; padding:4rem 2rem;">Here.</div>';
    return;
  }

  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);

  const values = { days:d, hours:h, minutes:m, seconds:s };

  Object.keys(values).forEach(key => {
    const el = document.getElementById(key);
    const val = values[key];

    if (lastValues[key] === -1) {
      el.textContent = String(val).padStart(2,'0');
      setTimeout(() => el.classList.add('visible'), 800);
    }
    else if (val !== lastValues[key]) {
      el.classList.remove('flip');
      void el.offsetWidth;
      el.textContent = String(val).padStart(2,'0');
      el.classList.add('flip');
    }
  });

  lastValues = values;
}

update();
setInterval(update, 1000);
</script>
</body>
</html>
